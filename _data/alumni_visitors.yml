- name: Zhaoqi Wang (王兆麒)
  photo: zhaoqi.webp
  duration: 2026.03 -- Present
  email: wang_zhaoqi@bit.edu.cn
  bio: Zhaoqi Wang received his bachelor's degree from Huazhong University of Science and Technology in 2017 and his master's degree from IAE Paris – Sorbonne Business School, Université Paris 1 Panthéon-Sorbonne, in 2023. He is currently a Ph.D. student in the School of Cyberspace Science and Technology at Beijing Institute of Technology. He has previously worked at Microsoft Research Asia and Kuaishou, where he gained research and industry experience in artificial intelligence and cybersecurity. His research interests lie in AI security, with a particular focus on prompt injection attacks and defenses, GEO poisoning attacks and defenses, self-evolving agents, and misinformation verification. He is also interested in building robust, trustworthy, and secure AI systems for real-world applications.


- name: Chunlong Xie (谢春龙)
  photo: chunlong.webp
  duration: 2025.12 -- Present
  email: clxie@cqu.edu.cn
  bio: I received my Bachelor's degree from Chongqing University in 2021 and am currently a Ph.D. candidate there (transferred from the Master's program in 2023). I am now a visiting Ph.D. student at the University of Auckland. My research focuses on adversarial attacks (e.g., jailbreaking, prompt injection) against generative AI, including LLMs, VLMs, T2I, and Agents.


- name: Sajjad Hassanpour
  photo: sajjad.webp
  duration: 
  email: shas998@aucklanduni.ac.nz
  bio: Sajjad Hassanpour is a Ph.D. student in Construction Engineering at the University of Auckland. He received a bachelor's degree in civil engineering at Iran University of Science and Technology in 2010, and his M.Sc. degree in transportation planning-at the Trabiat Modares University of Iran in 2012. During his Ph.D. in transportation planning, as he was interested in computer science, he started working on agent-based modeling and computer-based simulation models. Therefore, he started a new Ph.D. at the University of Auckland, focusing on agent-based building earthquake evacuation simulation. He is interested in pedestrian dynamics, multiagent systems, and machine learning.