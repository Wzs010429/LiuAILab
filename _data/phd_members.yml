- name: Haoyuan Li (李浩源)
  photo: haoyuan.webp
  duration: 2026.04 -- Present
  email: hli962@aucklanduni.ac.nz
  bio: I received my master's degree in Computer Science from the University of Auckland and my bachelor's degree in Computer Science from Shandong University of Technology. In 2022, I worked as a psychological counselor, which inspired my interest in applying AI technologies to real-world healthcare challenges. My research interests focus on AI for healthcare, particularly leveraging machine learning and deep learning techniques to support mental health and clinical decision-making. I am also interested in the intersection of Web3 and cryptocurrency technologies, exploring how decentralized systems can reshape digital identity and finance. Additionally, I am passionate about the practical applications of LLMs in areas such as medical consultation, intelligent assistants, and knowledge-driven services.





