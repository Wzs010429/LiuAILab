- name: Zhedong Lin (林哲栋)
  photo: zhedong.webp
  duration: To Start PhD
  email: zlin629@aucklanduni.ac.nz
  bio: I received my undergraduate degree in Computer Science and Technology from Southwest University in 2025. I am currently working under the guidance of Prof. Jiamou Liu, and my research focuses on LLMs, multimodal generative AI, and applications such as text-to-image and text-to-video generation, image and video editing, and controllable diffusion models. I will soon begin my PhD studies at the University of Auckland, continuing to work under the supervision of Prof. Jiamou Liu.
