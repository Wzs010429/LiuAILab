home:
  hero_title: We build
  hero_word: Civilised Agents
  hero_words:
    - Civilised Agents
    - Cultural Listeners
    - Value Reasoners
    - Creative Partners
  intro:
    - Civilised Agent Lab studies the human side of agentic AI - emotion, aesthetics, culture, values, and creativity.
    - We study agents that listen before answering, explain before generating, respect before recommending, and act with judgement rather than mere fluency.
  hero_slides:
    - research/overview.webp
    - work/emotional-judgement.png
    - work/aesthetic-reasoning.png
    - research/bedaia.webp
    - research/main.webp
    - work/creative-coagency.png
  manifesto:
    label: Manifesto
    title: Powerful agents should become responsible guests in human worlds.
    copy:
      - A system that only optimizes may damage what it cannot name. A system that only speaks fluently may miss what matters. A system that only obeys may walk neatly into moral darkness.
      - Civilised AI listens before answering, explains before generating, respects before recommending, and imagines before imitating.
  work_title: Explore our lab work
  work_more_text: View more
  work_more_url: /publications/
  work_cards:
    - title: Civilised Agency
      image: research/overview.webp
      alt: Research framework diagram for task understanding, skill-graph planning, and traceable execution.
      href: "#manifesto"
      link_text: View manifesto
      copy: A framework for agents that act as responsible guests in human worlds - attentive, situated, explainable, and capable of restraint.
    - title: Emotional Judgement
      image: work/emotional-judgement.png
      alt: Agent interface reading affective signals before a decision gate.
      href: /research/#directions
      link_text: View research
      copy: Agents should read affective stakes, vulnerability, timing, and uncertainty before deciding when to answer, refuse, delay, or ask.
    - title: Aesthetic Reasoning
      image: work/aesthetic-reasoning.png
      alt: Generated media frames evaluated for composition and aesthetic fit.
      href: /research/#evaluation
      link_text: View evaluation
      copy: Beyond correct outputs, agents need taste, proportion, form, and sensitivity to how generated artifacts feel, signify, and fit.
    - title: Cultural Context
      image: research/bedaia.webp
      alt: Bedaia system architecture for culture-aware story generation and localization.
      href: /research/#culture-values
      link_text: View context work
      copy: Civilised agents must reason with tacit norms, histories, local practices, and relationships rather than treating every user as context-free.
    - title: Plural Values + Restraint
      image: research/main.webp
      alt: Debate-agent workflow for comparing arguments, histories, and value-sensitive revisions.
      href: /research/#culture-values
      link_text: View value work
      copy: When values conflict, agents should expose tradeoffs, preserve human agency, and avoid collapsing disagreement into a single optimized answer.
    - title: Creative Co-agency
      image: work/creative-coagency.png
      alt: Human and AI agents co-creating image and video frames.
      href: /people/
      link_text: Meet collaborators
      copy: We study agents as creative partners that expand imagination while preserving authorship, identity, meaning, and human judgement.

research:
  label: Research
  title: Research directions
  intro: We study civilised agentic AI as a computer science problem - generative models, multi-agent systems, incentive mechanisms, trustworthy evaluation, and human-agent interaction.
  section_label: Research Directions
  section_title: Six computer science directions for civilised agentic AI
  section_copy: Each direction turns the lab's manifesto into concrete research on algorithms, systems, evaluation protocols, and computational institutions for agentic AI.
  directions:
    - id: creative
      number: "01"
      title: Image Generation and Visual Creative Agents
      copy: We study controllable image generation, visual editing, multimodal prompting, and creative agents that can plan, critique, and revise visual artifacts with users.
      questions:
        - How can diffusion and multimodal models support controllable visual reasoning?
        - How should agents evaluate composition, style, identity, and cultural meaning?
    - id: video-generation
      number: "02"
      title: Video Generation and Temporal World Models
      copy: We investigate video generation, temporal consistency, scene dynamics, and agent-controlled media systems for narrative, education, and simulation.
      questions:
        - How can generative video models preserve identity, motion, and causal structure?
        - How can agents storyboard, generate, inspect, and repair video sequences?
    - id: multi-agent-systems
      number: "03"
      title: Multi-Agent Systems and Agent Societies
      copy: We design and evaluate systems of multiple AI agents that coordinate, negotiate, delegate, compete, and form social or organizational structures.
      questions:
        - How can agent societies coordinate under partial information and value conflict?
        - How should roles, memory, protocols, and communication channels be designed?
    - id: marketplace-mechanism
      number: "04"
      title: AI Marketplace and Mechanism Design
      copy: We study computational markets where humans, agents, models, tools, and data services interact through incentives, reputation, pricing, allocation, and governance rules.
      questions:
        - What auction, matching, and pricing mechanisms work for agent-mediated services?
        - How can reputation and incentive design reduce manipulation and low-quality output?
    - id: evaluation
      number: "05"
      title: Trustworthy Agent Evaluation and Safety
      copy: We develop benchmarks, auditing methods, reliability tests, provenance mechanisms, and safety protocols for agents that act across tools, users, and institutions.
      questions:
        - How should we test calibration, refusal, robustness, and recovery from mistakes?
        - How can agent actions be logged, explained, audited, and attributed?
    - id: culture-values
      number: "06"
      title: Cultural and Value-Aware Human-Agent Interaction
      copy: We build interfaces and computational models that help agents reason about cultural context, plural values, user intent, and human judgement in real workflows.
      questions:
        - How can agents adapt to context without stereotyping or over-personalizing?
        - How should interfaces expose uncertainty, disagreement, and value tradeoffs?

